<a [routerLink]="['/']">Tous les départements</a>
<br />
<input type="search" [(ngModel)]="search" placeholder="Rechercher une commune..." />
<p>{{ filteredCommunes().length }} communes sur {{ communes().length }}</p>

<div class="grid">
  @for (commune of filteredCommunes(); track commune.code) {
    <app-commune-card
      [commune]="commune"
      [favorite]="favorites.isFavorite(commune.code)"
      (toggleFavorite)="favorites.toggle($event)"
    />
  } @empty {
    <p>Chargement...</p>
  }
</div>
